name = "plummer"
main = "src/index.js"
compatibility_date = "2025-04-01"

# ─── KV Namespace ────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SIPPER"
id = "255c3d829a4d4fd788160a3e3928c0cb"
# Uncomment and fill in a preview namespace ID for `wrangler dev`:
preview_id = "3066f76b06bb4e51943cc1aa425ad762"

# ─── Custom Domain (optional) ────────────────────────────────────────────────
# Uncomment and update to route a custom domain through this worker.
[[routes]]
pattern = "kiya.party/*"
zone_id = "c274e776cf92ab6edc345be1ca77db81"


# ─── Secrets (set via CLI, NOT in this file) ─────────────────────────────────
# npx wrangler secret put ADMIN_SECRET
# This is the password used to access the /admin dashboard.


[observability]
[observability.logs]
enabled = true
invocation_logs = true
